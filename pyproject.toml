[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agnescli"
version = "0.1.0"
description = "Agent CLI for Agnes AI — chat, image, and video generation"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
    "click>=8.1",
    "httpx>=0.27",
    "rich>=13.0",
    "prompt_toolkit>=3.0",
]

[project.scripts]
agnescli = "agnescli.cli:main"

[tool.setuptools.packages.find]
include = ["agnescli*"]
