[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agnescli"
version = "0.1.0"
description = "Autonomous Agent CLI for Agnes AI - chat, code, image, and video generation"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "makur6371"}]
keywords = ["ai", "agent", "cli", "multimodal", "image-generation", "video-generation", "agnes"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "click>=8.1",
    "httpx>=0.27",
    "rich>=13.0",
    "prompt_toolkit>=3.0",
]

[project.urls]
Homepage = "https://github.com/makur6371/agnescli"
Repository = "https://github.com/makur6371/agnescli"
Issues = "https://github.com/makur6371/agnescli/issues"
Documentation = "https://agnes-ai.com"

[project.scripts]
agnescli = "agnescli.cli:main"

[tool.setuptools.packages.find]
include = ["agnescli*"]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501"]
